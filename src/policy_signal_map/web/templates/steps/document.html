{% extends "base.html" %}

{% block content %}
<div class="stack">
  <section class="card card-lg">
    <div class="card-head">
      <div>
        <h1 class="title">전체 문서</h1>
        <p class="subtitle">저장될 내용 그대로입니다. Markdown 파일로 저장한 뒤 한글·워드에서 손질할 수 있습니다.</p>
      </div>
      <span class="head-actions">
        <a class="btn btn-ghost" href="/step/5">← 비교 화면으로</a>
        <button type="button" class="btn btn-ghost" data-print-button>PDF로 저장</button>
        <button type="button" class="btn btn-primary" data-save-button data-url="/step/5/download" data-filename="{{ filename }}">결과 저장</button>
      </span>
    </div>
    <p class="note" data-save-note hidden></p>
  </section>

  <section class="card">
    <div class="table-scroll">
      <pre class="doc-source">{{ markdown }}</pre>
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/save.js') }}?v={{ asset_version | default('') }}"></script>
<script src="{{ url_for('static', path='js/print.js') }}?v={{ asset_version | default('') }}"></script>
{% endblock %}
